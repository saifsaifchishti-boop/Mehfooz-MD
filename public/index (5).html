<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEHFOOZ-MD - Pairing</title>
<style>
  :root{--bg:#070d0a;--card:#0e1713;--line:#1b3a2b;--text:#e8f5ee;--muted:#8aa597;--accent:#18e07a;--bad:#f87171}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  .box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 18px}
  .logo{display:block;width:84px;height:84px;border-radius:50%;margin:0 auto 10px;border:2px solid var(--accent)}
  h1{text-align:center;margin:0;font-size:26px;letter-spacing:1px;color:var(--accent)}
  .sub{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 20px}
  .srv{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px;background:#0a120e}
  .dot{width:10px;height:10px;border-radius:50%;background:#555;flex:none}.dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}.dot.off{background:var(--bad)}
  .srv select{flex:1;min-width:0;background:transparent;border:0;color:var(--text);font-size:16px;font-weight:600;outline:none}
  .srv select option{background:#0e1713}
  .st{font-size:11px;color:var(--muted)}
  label{display:block;font-size:14px;margin:0 0 6px;font-weight:600}
  .inp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:0 12px;background:#0a120e}
  .inp span{color:var(--muted)}
  .inp input{flex:1;min-width:0;background:transparent;border:0;color:var(--text);font-size:17px;padding:14px 0;outline:none}
  .hint{font-size:12px;color:var(--muted);margin:6px 0 16px}
  button.go{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;color:#03140a;background:var(--accent);cursor:pointer}
  button.go:disabled{opacity:.6}
  .code{margin-top:14px;border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:15px;min-height:56px}
  .code b{font-size:26px;letter-spacing:4px;color:var(--accent)}
  .cp{margin-top:10px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:8px 18px;font-size:14px;cursor:pointer}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>

  <h1>MEHFOOZ-MD</h1>
  <div class="sub">Generate Your Pairing Code</div>

  <div class="srv"><span class="dot" id="dot"></span>
    <div style="flex:1;min-width:0"><select id="srv"><option>Loading...</option></select><div class="st" id="st">Checking...</div></div>
  </div>

  <label>WhatsApp Number</label>
  <div class="inp"><span>+92</span><input id="num" type="tel" inputmode="numeric" placeholder="3xxxxxxxxx"></div>
  <div class="hint">Country code ke baghair number likhein (Pakistan: +92)</div>

  <button class="go" id="go">Generate Pair Code</button>
  <div class="code" id="code">Your pairing code will appear here</div>

  <div class="foot">&copy; 2026 MEHFOOZ-MD &bull; <a id="adm" href="#" target="_blank" style="color:inherit">Admin</a></div>
</div>
<script>
(function(){
  var servers=[],base='',last='';
  var sel=document.getElementById('srv'),dot=document.getElementById('dot'),st=document.getElementById('st'),box=document.getElementById('code');
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

  function ping(){
    dot.className='dot';st.textContent='Checking...';
    var c=new AbortController(),t=setTimeout(function(){c.abort()},9000);
    fetch(base,{mode:'no-cors',cache:'no-store',signal:c.signal})
      .then(function(){clearTimeout(t);dot.className='dot on';st.textContent='Online'})
      .catch(function(){clearTimeout(t);dot.className='dot off';st.textContent='Server start ho raha hai, thori der baad try karein'});
  }
  function pick(){
    if(!servers.length)return;
    base=servers[sel.value].url.replace(/\/+$/,'');
    document.getElementById('adm').href=base+'/admin';
    ping();
  }
  fetch('/servers.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(l){
    servers=l.filter(function(s){return s&&s.name&&s.url});
    sel.innerHTML=servers.map(function(s,i){return '<option value="'+i+'">'+esc(s.name)+'</option>'}).join('');
    pick();
  }).catch(function(){sel.innerHTML='<option>servers.json nahi mili</option>'});
  sel.addEventListener('change',pick);

  document.getElementById('go').addEventListener('click',async function(){
    var btn=this,n=document.getElementById('num').value.replace(/[^0-9]/g,'').replace(/^0+/,'');
    if(!base){alert('Pehle server chunein');return}
    if(!n){alert('Apna WhatsApp number likhein');return}
    btn.disabled=true;box.textContent='Requesting...';
    try{
      var r=await fetch(base+'/get-pairing-code?number='+encodeURIComponent('92'+n)+'&sessionId=new&agree=1');
      var d=await r.json();
      if(d.code){last=d.code;box.innerHTML='<b>'+esc(d.code)+'</b><br><button class="cp" id="cp">Copy</button>';
        document.getElementById('cp').onclick=function(){var b=this;(navigator.clipboard?navigator.clipboard.writeText(last):Promise.reject()).then(function(){b.textContent='Copied'}).catch(function(){b.textContent='Copy nahi hua'})}}
      else box.textContent='Error: '+(d.message||d.error||'Failed');
    }catch(e){box.innerHTML='Code is page par nahi aa saka ('+esc(e&&e.message||'error')+').<br><br>Is server ka panel direct kholein, wahan code zaroor dikhega:<br><a class="cp" style="display:inline-block;margin-top:8px;text-decoration:none" href="'+esc(base)+'" target="_blank">Server panel kholein</a>'}
    btn.disabled=false;
  });
})();
</script>
